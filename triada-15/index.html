<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ADKAR-радар «Триада-15»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5fb;
    --card:rgba(255,255,255,.84);
    --card-solid:#ffffff;
    --card2:#f7f6fc;
    --opt-on:#f3f1ff;
    --text:#1e1b3a;
    --text2:#45416a;
    --muted:#6e6a8f;
    --line:#e3e1f0;
    --line2:#eeedf6;
    --accent:#5b54e8;
    --accent-ink:#ffffff;
    --accent-soft:#ecebfd;
    --grad:linear-gradient(135deg,#5b54e8 0%,#8b5cf6 55%,#d946ef 100%);
    --glow1:#dcdafe; --glow2:#fbe0f3; --glow3:#d5f5ee;
    --z0:#fde4e4; --z1:#ffecd9; --z2:#fdf5cc; --z3:#dcf6e5;
    --z0i:#b4232c; --z1i:#b5520e; --z2i:#8a6a05; --z3i:#1f7a46;
    --z0s:#f28b8b; --z1s:#f5a766; --z2s:#e5c448; --z3s:#6fd09a;
    --note:#fff7e6; --note-line:#f1d9a5;
    --shadow:0 1px 2px rgba(30,27,58,.04),0 10px 30px -12px rgba(49,40,120,.18);
    --shadow-hi:0 2px 4px rgba(30,27,58,.06),0 16px 36px -14px rgba(91,84,232,.45);
    --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e0d1c;
      --card:rgba(28,26,52,.8);
      --card-solid:#1c1a34;
      --card2:#17162c;
      --opt-on:#25224a;
      --text:#ecebfa;
      --text2:#c7c4e6;
      --muted:#9793bd;
      --line:#34315a;
      --line2:#2a2849;
      --accent:#9d97ff;
      --accent-ink:#ffffff;
      --accent-soft:#2a2656;
      --grad:linear-gradient(135deg,#6d66ff 0%,#9b6bff 55%,#e060f0 100%);
      --glow1:#262070; --glow2:#421b52; --glow3:#0d3637;
      --z0:#43222a; --z1:#44301f; --z2:#3f3719; --z3:#1d3a2b;
      --z0i:#ffabab; --z1i:#ffc38f; --z2i:#f2d77a; --z3i:#8fe3b3;
      --z0s:#b8545d; --z1s:#b9773f; --z2s:#a8903a; --z3s:#3f9c69;
      --note:#2c2717; --note-line:#5c4f2c;
      --shadow:0 10px 30px -12px rgba(0,0,0,.6);
      --shadow-hi:0 16px 36px -14px rgba(120,100,255,.55);
    }
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--text);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:19px;
    line-height:1.55;
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 520px at -5% -10%,var(--glow1),transparent 62%),
      radial-gradient(760px 480px at 105% 0%,var(--glow2),transparent 60%),
      radial-gradient(900px 620px at 50% 110%,var(--glow3),transparent 62%);
    background-attachment:fixed;
  }
  .wrap{max-width:780px;margin:0 auto;padding:18px 16px 72px;}
  h1{font-size:30px;line-height:1.2;margin:6px 0 12px;font-weight:800;letter-spacing:-.02em;}
  h2{font-size:23px;line-height:1.3;margin:0 0 12px;font-weight:700;letter-spacing:-.01em;}
  h3{font-size:20px;line-height:1.3;margin:0 0 8px;font-weight:700;}
  p{margin:0 0 12px;}
  p:last-child{margin-bottom:0;}
  ul{margin:0;padding-left:1.2em;}
  li{margin:6px 0;}
  b,strong{font-weight:700;}
  .lead{color:var(--muted);font-size:18px;}
  .small{font-size:16px;color:var(--muted);}
  .card{
    background:var(--card);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px;
    margin:0 0 16px;
    box-shadow:var(--shadow);
  }
  .eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 11px;border-radius:999px;margin:0 0 8px;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone;}

  /* шапка */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--text2);}
  .logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--shadow-hi);}
  .logo svg{width:20px;height:20px;color:#fff;transform:rotate(45deg);}
  .sound-btn{
    width:46px;height:46px;border-radius:50%;padding:0;
    border:1px solid var(--line);background:var(--card);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:var(--text2);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .15s ease,color .2s ease,border-color .2s ease;
  }
  .sound-btn:hover{transform:scale(1.07);color:var(--accent);border-color:var(--accent);}
  .sound-btn svg{width:22px;height:22px;}

  /* обложка */
  .hero{position:relative;overflow:hidden;padding:28px 24px;}
  .hero::before{content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;background:var(--grad);opacity:.14;filter:blur(10px);pointer-events:none;}
  .hero-body{position:relative;padding-right:110px;}
  .hero h1{font-size:34px;}
  .hero-art{position:absolute;right:26px;top:24px;width:76px;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(91,84,232,.35));}
  .hero-art svg{display:block;width:100%;height:auto;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chip{display:inline-flex;align-items:center;padding:6px 13px;border-radius:999px;background:var(--card-solid);border:1px solid var(--line);color:var(--text2);font-size:15px;font-weight:700;}
  ul.checks{list-style:none;padding:0;}
  ul.checks li{position:relative;padding-left:38px;margin:12px 0;}
  ul.checks li::before{content:"";position:absolute;left:0;top:.15em;width:25px;height:25px;border-radius:50%;background:var(--grad);box-shadow:0 4px 10px -4px rgba(91,84,232,.6);}
  ul.checks li::after{content:"";position:absolute;left:9.5px;top:calc(.15em + 5px);width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}

  /* кнопки */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:56px;padding:14px 22px;
    font:inherit;font-size:19px;font-weight:700;line-height:1.25;
    border-radius:14px;border:1px solid var(--line);
    background:var(--card-solid);color:var(--text);
    cursor:pointer;text-align:center;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease,box-shadow .2s ease,border-color .2s ease,filter .2s ease;
  }
  .btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0) scale(.985);}
  .btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--shadow-hi);}
  .btn.primary:hover{filter:brightness(1.07) saturate(1.05);box-shadow:var(--shadow-hi);}
  .btn.primary.ready{animation:ready 1.8s ease-in-out infinite;}
  .btn.quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:600;font-size:17px;min-height:48px;text-decoration:underline;text-underline-offset:3px;box-shadow:none;}
  .btn.quiet:hover{transform:none;color:var(--text2);}
  .btn.block{display:flex;width:100%;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > .btn{flex:1 1 200px;}

  /* поля */
  label.field{display:block;margin:0 0 14px;}
  label.field span{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  input[type="text"]{
    width:100%;min-height:54px;padding:12px 16px;
    font:inherit;font-size:19px;color:var(--text);
    background:var(--card-solid);border:1.5px solid var(--line);border-radius:12px;
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  input[type="text"]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}

  /* прогресс */
  .progress{position:relative;height:10px;background:var(--line2);border-radius:99px;margin:14px 40px 12px 0;}
  .progress > div{position:relative;height:100%;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 16px -2px rgba(139,92,246,.6);}
  .bar-rocket{position:absolute;right:-26px;top:50%;width:16px;transform:translateY(-50%) rotate(90deg);pointer-events:none;}
  .bar-rocket svg{display:block;width:100%;height:auto;}
  .step{font-size:16px;font-weight:600;color:var(--muted);margin:0 0 10px;}
  .el-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .el-id{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:52px;height:52px;padding:0 12px;border-radius:16px;
    background:var(--grad);color:#fff;font-size:22px;font-weight:800;box-shadow:var(--shadow-hi);
  }
  .el-en{font-size:17px;color:var(--muted);font-weight:500;}
  .hint{background:var(--accent-soft);border-radius:14px;padding:12px 16px;font-size:17px;color:var(--text2);}

  /* вопрос */
  .q{
    background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;margin:0 0 16px;box-shadow:var(--shadow);
    transition:border-color .2s ease,box-shadow .2s ease;
  }
  .q.missing{border-color:var(--z0s);box-shadow:0 0 0 4px var(--z0);animation:nudge .45s ease;}
  .q-level{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .q-text{display:block;font-size:21px;font-weight:700;line-height:1.35;margin-bottom:14px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  label.opt{
    position:relative;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;
    min-height:58px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:14px;background:var(--card-solid);
    cursor:pointer;font-size:18px;line-height:1.35;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease;
  }
  label.opt:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(91,84,232,.55);}
  label.opt input{position:absolute;opacity:0;width:1px;height:1px;}
  label.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px;}
  label.opt .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:50%;
    border:1.5px solid var(--line);color:var(--muted);font-weight:700;font-size:18px;
  }
  label.opt.on{border-color:transparent;background:linear-gradient(var(--opt-on),var(--opt-on)) padding-box,var(--grad) border-box;box-shadow:0 10px 22px -14px rgba(91,84,232,.8);}
  label.opt.on .num{background:var(--grad);border-color:transparent;color:#fff;animation:pop .35s cubic-bezier(.2,.9,.3,1.5);}
  label.ev{
    position:relative;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;
    margin-top:12px;padding:12px 14px;min-height:54px;
    border-radius:14px;border:1.5px dashed var(--line);cursor:pointer;font-size:17px;color:var(--text2);
    transition:border-color .2s ease,background .2s ease;
  }
  label.ev:hover{border-color:var(--accent);}
  label.ev input{position:absolute;opacity:0;width:1px;height:1px;}
  label.ev:focus-within{outline:3px solid var(--accent);outline-offset:2px;}
  label.ev .box{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--card-solid);position:relative;}
  label.ev.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
  label.ev.on .box{background:var(--grad);border-color:transparent;animation:pop .35s cubic-bezier(.2,.9,.3,1.5);}
  label.ev.on .box::after{
    content:"";position:absolute;left:10px;top:5px;width:8px;height:14px;
    border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);
  }
  .q-err{color:var(--z0i);font-size:16px;margin:10px 0 0;font-weight:700;}
  .navrow{display:flex;gap:12px;margin-top:8px;}
  .navrow .btn{flex:1;}
  .navrow .btn.primary{flex:2;}

  /* результат */
  .verdict{box-shadow:inset 6px 0 0 var(--accent),var(--shadow);}
  .verdict.alert{box-shadow:inset 6px 0 0 var(--z0s),var(--shadow);}
  .zone-chip{
    display:inline-block;padding:3px 11px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap;
  }
  .zc0{background:var(--z0);color:var(--z0i);}
  .zc1{background:var(--z1);color:var(--z1i);}
  .zc2{background:var(--z2);color:var(--z2i);}
  .zc3{background:var(--z3);color:var(--z3i);}

  .radar-card{padding:14px 10px 18px;}
  svg.radar{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;}
  .ring.z0{fill:var(--z0);} .ring.z1{fill:var(--z1);} .ring.z2{fill:var(--z2);} .ring.z3{fill:var(--z3);}
  .ring{stroke:var(--card-solid);stroke-width:1.5;}
  .axis{stroke:var(--card-solid);stroke-width:1.5;}
  .ringnum{fill:var(--muted);font-size:12px;}
  .poly-cur{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;}
  .poly-prev{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5;stroke-linejoin:round;}
  .spread{stroke:var(--text);stroke-opacity:.16;stroke-width:12;stroke-linecap:round;}
  .mk{fill:var(--text2);}
  .dot{fill:var(--card-solid);stroke:var(--accent);stroke-width:3;}
  .bn-ring{fill:none;stroke:var(--z0i);stroke-width:2;stroke-dasharray:4 3;}
  .lab{fill:var(--text2);font-size:14px;}
  .lab-strong{fill:var(--text);font-size:16px;font-weight:800;}
  .lab-bn{fill:var(--z0i);font-size:13px;font-weight:700;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:10px;font-size:15px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend svg{flex:none;}
  .sw{width:16px;height:16px;border-radius:5px;display:inline-block;}

  .elcard h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .elcard .meta{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px;}
  .pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:15px;background:var(--card2);border:1px solid var(--line2);color:var(--text2);white-space:nowrap;}
  .elcard.is-bn{border-color:var(--z0s);}
  .bn-tag{font-size:14px;font-weight:700;color:var(--z0i);background:var(--z0);padding:2px 10px;border-radius:999px;}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;}
  .lvl{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;text-align:center;}
  .lvl .ln{display:block;font-size:14px;color:var(--muted);}
  .lvl .lv{display:block;font-size:22px;font-weight:800;}
  .lvl.low{border-color:var(--z0s);}
  .lvl.low .lv{color:var(--z0i);}
  .elcard p{font-size:18px;}
  .elcard .sub{color:var(--text2);}

  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px;background:var(--card-solid);box-shadow:var(--shadow);}
  table{border-collapse:collapse;width:100%;min-width:620px;font-size:17px;}
  th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;}
  th{font-size:13px;font-weight:700;color:var(--muted);background:var(--card2);text-transform:uppercase;letter-spacing:.04em;}
  th:first-child,td:first-child{text-align:left;padding-left:14px;}
  tbody tr:last-child td{border-bottom:0;}
  tr.is-bn td{background:var(--z0);}
  tr.is-bn td:first-child{box-shadow:inset 4px 0 0 var(--z0s);}
  .delta-up{color:var(--z3i);font-weight:700;}
  .delta-down{color:var(--z0i);font-weight:700;}
  .delta-eq{color:var(--muted);}
  td.cell-low{color:var(--z0i);font-weight:800;}

  .note{background:var(--note);border:1px solid var(--note-line);border-radius:14px;padding:14px 16px;font-size:17px;}
  .hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
  .hist li{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--card2);}
  .hist .hd{font-weight:700;font-size:17px;}
  .hist .hs{font-size:16px;color:var(--text2);font-variant-numeric:tabular-nums;flex:1 1 220px;}
  .hist .btn{min-height:48px;font-size:17px;padding:10px 16px;}
  .hist .tag{font-size:15px;color:var(--muted);}

  details.int{border:1px solid var(--line);border-radius:16px;background:var(--card);margin:0 0 12px;box-shadow:var(--shadow);}
  details.int > summary{
    list-style:none;cursor:pointer;padding:16px 18px;min-height:58px;
    display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;
  }
  details.int > summary::-webkit-details-marker{display:none;}
  details.int > summary::after{content:"";margin-left:auto;width:10px;height:10px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);flex:none;transition:transform .2s ease;}
  details.int[open] > summary::after{transform:rotate(-135deg);}
  details.int .body{padding:0 18px 16px;}
  details.int .body li{font-size:18px;}
  details.int.is-bn{border-color:var(--z0s);}
  .zones{display:flex;flex-direction:column;gap:8px;}
  .zones div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;}
  .zones b.zn{font-size:22px;text-align:center;}
  .pat{border-top:1px solid var(--line2);padding:12px 0;}
  .pat:first-of-type{border-top:0;padding-top:0;}
  .pat h3{font-size:18px;margin-bottom:4px;}
  .pat p{font-size:18px;}
  .foot{color:var(--muted);font-size:15px;text-align:center;margin-top:28px;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* появление экранов */
  #app.enter > *{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;}
  #app.enter > *:nth-child(2){animation-delay:.04s;}
  #app.enter > *:nth-child(3){animation-delay:.08s;}
  #app.enter > *:nth-child(4){animation-delay:.12s;}
  #app.enter > *:nth-child(5){animation-delay:.16s;}
  #app.enter > *:nth-child(6){animation-delay:.2s;}
  #app.enter > *:nth-child(n+7){animation-delay:.24s;}

  /* ракета */
  .rocket .flame{transform-box:fill-box;transform-origin:50% 0;animation:flicker .12s ease-in-out infinite alternate;}
  .rocket.off .flame{display:none;}

  /* запуск */
  .launch{
    position:fixed;inset:0;z-index:1000;overflow:hidden;cursor:pointer;
    background:radial-gradient(ellipse at 50% 120%,#3b2a7a 0%,#161039 45%,#05040f 100%);
    opacity:0;transition:opacity .35s ease;
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .launch.show{opacity:1;}
  .launch.hide{opacity:0;transition:opacity .7s ease;}
  .launch canvas{position:absolute;inset:0;width:100%;height:100%;}
  .launch .pad{position:absolute;left:50%;bottom:0;width:240px;height:40px;transform:translateX(-50%);background:linear-gradient(#57557c,#2a2945);border-radius:14px 14px 0 0;box-shadow:0 -6px 30px rgba(255,170,80,.25);}
  .launch .ship{position:absolute;left:50%;bottom:34px;width:96px;margin-left:-48px;will-change:transform;}
  .launch .ship svg{display:block;width:100%;height:auto;}
  .launch .ship.shake .shaker{animation:shake .07s linear infinite;}

/* ===================== Хранение ===================== */

var KEY_DRAFT = "triada15:draft";
var KEY_HIST  = "triada15:history";
var storageOk = true;
var memoryStore = {};

function readJSON(key, fallback){
  try{
    var raw = window.localStorage.getItem(key);
    if(raw) return JSON.parse(raw);
  }catch(e){ storageOk = false; }
  return Object.prototype.hasOwnProperty.call(memoryStore, key) ? JSON.parse(memoryStore[key]) : fallback;
}
function writeJSON(key, value){
  var raw = JSON.stringify(value);
  memoryStore[key] = raw;
  try{ window.localStorage.setItem(key, raw); }
  catch(e){ storageOk = false; }
}
function removeKey(key){
  delete memoryStore[key];
  try{ window.localStorage.removeItem(key); }catch(e){}
}

function loadHistory(){
  var h = readJSON(KEY_HIST, []);
  return Array.isArray(h) ? h.filter(isCompleteResult) : [];
}
function isCompleteResult(r){
  if(!r || !r.answers) return false;
  return ELEMENTS.every(function(el){
    return el.q.every(function(q){
      var a = r.answers[q.code];
      return a && typeof a.v === "number" && a.v >= 0 && a.v <= 3;
    });
  });
}

function loadDraft(){
  var d = readJSON(KEY_DRAFT, null);

  state.block   = (typeof d.block === "number" && d.block >= 0 && d.block < 5) ? d.block : 0;
  state.project = typeof d.project === "string" ? d.project : "";
  state.people  = Array.isArray(d.people) ? [0,1,2].map(function(i){ return typeof d.people[i] === "string" ? d.people[i] : ""; }) : ["","",""];
  state.answers = (d.answers && typeof d.answers === "object") ? d.answers : {};
}
function saveDraft(){
  writeJSON(KEY_DRAFT, {block:state.block, project:state.project, people:state.people, answers:state.answers});
}

/* ===================== Расчёт ===================== */

function answeredCount(answers){
  var n = 0;
  ELEMENTS.forEach(function(el){ el.q.forEach(function(q){
    var a = answers[q.code]; if(a && typeof a.v === "number") n++;
  }); });
  return n;
}

function compute(answers){
  var els = {};
  var order = ELEMENTS.map(function(e){ return e.id; });
  ELEMENTS.forEach(function(el){
    var vals = el.q.map(function(q){ return answers[q.code].v; });
    var ev = el.q.reduce(function(s, q){ return s + (answers[q.code].ev ? 1 : 0); }, 0);
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    els[el.id] = {vals:vals, score:mn, max:mx, spread:mx - mn, ev:ev, pattern:patternOf(vals)};
  });
  var minScore = Math.min.apply(null, order.map(function(id){ return els[id].score; }));
  var byMin = order.filter(function(id){ return els[id].score === minScore; });
  var bottleneck = byMin[0];
  var boomerang = els.A.score === 3 && els.D.score === 3 && (els.K.score <= 1 || els.Ab.score <= 1);
  if(boomerang){ bottleneck = els.K.score <= els.Ab.score ? "K" : "Ab"; }
  var evTotal = order.reduce(function(s, id){ return s + els[id].ev; }, 0);
  return {
    els:els,
    minScore:minScore,
    bottleneck: minScore === 3 ? null : bottleneck,
    tied: boomerang ? [] : byMin.slice(1),
    boomerang:boomerang,
    evTotal:evTotal
  };
}

function patternOf(vals){
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if(mx - mn <= 1) return {type:"even"};
  var lows = [];
  vals.forEach(function(v, i){ if(v === mn) lows.push(i); });
  if(lows.length === 1) return {type:["words","deeds","env"][lows[0]]};
  return {type:"twoLow", high: vals.indexOf(mx)};
}

function patternText(p){
  if(p.type === "twoLow"){
    return {title:"Один канал заметно выше", text:"Выше остальных — «" + LEVELS[p.high].short.toLowerCase() + "». Балл определяют два отстающих канала — начинать стоит с них."};
  }
  return PATTERNS[p.type];
}

function evidenceLevel(n){
  if(n >= 11) return "Радар можно считать диагнозом.";
  if(n >= 6)  return "Это рабочая гипотеза — её стоит проверить.";
  return "Пока это догадка, а не измерение.";
}

var Sound = (function(){
  var KEY = "triada15:sound";
  var ctx = null, master = null, live = [];
  var on = true;
  try{ on = window.localStorage.getItem(KEY) !== "off"; }catch(e){}

  function ac(){
    if(!on) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!ctx){
      try{ ctx = new AC(); }catch(e){ return null; }
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    }
    if(ctx.state === "suspended"){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  function track(src){
    live.push(src);
    src.onended = function(){ var i = live.indexOf(src); if(i >= 0) live.splice(i, 1); };
  }
  function tone(freq, start, dur, type, vol, freqEnd){
    var c = ac(); if(!c) return;
    var t = c.currentTime + (start || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
    track(o);
  }
  function noise(start, dur, vol, f0, f1){
    var c = ac(); if(!c) return;
    var t = c.currentTime + start;
    var len = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var s = c.createBufferSource(); s.buffer = buf;
    var fl = c.createBiquadFilter(); fl.type = "lowpass";
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.35);
    g.gain.setValueAtTime(vol, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur);
    track(s);
  }

  return {
    isOn: function(){ return on; },
    toggle: function(){
      on = !on;
      try{ window.localStorage.setItem(KEY, on ? "on" : "off"); }catch(e){}
      if(on) this.select(2); else this.hush();
      return on;
    },
    hush: function(){
      live.slice().forEach(function(s){ try{ s.stop(); }catch(e){} });
      live = [];
    },
    select: function(v){
      var f = [392, 440, 523.25, 659.25][v] || 523.25;
      tone(f, 0, 0.18, "triangle", 0.22);
      tone(f * 1.5, 0.045, 0.16, "sine", 0.09);
    },
    tick: function(checked){ tone(checked ? 1174.66 : 698.46, 0, 0.09, "triangle", 0.14); },
    tap: function(){ tone(420, 0, 0.07, "sine", 0.14, 260); },
    next: function(){
      [523.25, 659.25, 783.99].forEach(function(f, i){ tone(f, i * 0.07, 0.24, "triangle", 0.18); });
    },
    error: function(){
      tone(233, 0, 0.14, "square", 0.05, 190);
      tone(185, 0.13, 0.2, "square", 0.05, 150);
    },
    beep: function(final){ tone(final ? 1046.5 : 659.25, 0, final ? 0.4 : 0.15, "sine", 0.26); },
    launch: function(){
      noise(0, 3.8, 0.45, 180, 2600);
      tone(70, 0.2, 3.2, "sawtooth", 0.05, 360);
    },
    fanfare: function(){
      [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
        tone(f, i * 0.11, i === 3 ? 0.8 : 0.22, "triangle", 0.2);
      });
      for(var i = 0; i < 7; i++){
        tone(1500 + Math.random() * 1400, 0.5 + i * 0.07, 0.16, "sine", 0.05);
      }
    }
  };
})();

var Launch = (function(){
  var root = null, cv = null, cx = null, ship = null, raf = 0, timers = [];
  var parts = [], stars = [], confetti = [];
  var lit = false, flying = false, speed = 0, W = 0, H = 0;
  var COLORS = ["#6366f1","#8b5cf6","#d946ef","#f59e0b","#22c55e","#38bdf8","#f43f5e","#facc15"];

  function reduced(){
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function resize(){
    if(!cv) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function makeStars(){
    stars = [];
    var n = Math.round(W * H / 4500);
    for(var i = 0; i < n; i++){
      stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.3, a:Math.random()*6.28, s:Math.random()*.6+.4});
    }
  }
  function burst(){
    for(var i = 0; i < 190; i++){
      var ang = Math.random() * Math.PI * 2, sp = Math.random() * 9 + 3;
      confetti.push({x:W/2, y:H*.4, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 5,
        w:Math.random()*8+5, h:Math.random()*5+4, rot:Math.random()*6, vr:(Math.random()-.5)*.35, c:COLORS[i % COLORS.length]});
    }
  }
  function emit(){
    if(!ship) return;
    var r = ship.getBoundingClientRect();
    if(r.bottom < -40) return;
    var nx = r.left + r.width / 2, ny = r.top + r.height * .72;
    var n = flying ? 7 : 5;
    for(var i = 0; i < n; i++){
      parts.push({x:nx + (Math.random()-.5)*r.width*.25, y:ny,
        vx:(Math.random()-.5)*(flying ? 1.6 : 3), vy:Math.random()*4 + (flying ? 5 : 2),
        r:Math.random()*6+4, life:1, decay:Math.random()*.02+.014, hot:Math.random() < .55});
    }
  }
  function frame(){
    if(!cx) return;
    cx.clearRect(0, 0, W, H);
    speed += ((flying ? 16 : 0) - speed) * .03;
    var i;
    cx.fillStyle = "#fff";
    for(i = 0; i < stars.length; i++){
      var s = stars[i];
      s.a += .05; s.y += speed * s.s;
      if(s.y > H){ s.y -= H; s.x = Math.random() * W; }
      cx.globalAlpha = .45 + .45 * Math.sin(s.a);
      if(speed > 2){ cx.fillRect(s.x, s.y, s.r, s.r + speed * s.s * 1.4); }
      else{ cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.29); cx.fill(); }
    }
    if(lit) emit();
    for(i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy *= .97; p.vx *= .985; p.r += .55; p.life -= p.decay;
      if(!flying && p.y > H - 44){ p.y = H - 44; p.vy = 0; p.vx += (p.vx >= 0 ? 1 : -1) * .5; }
      if(p.life <= 0){ parts.splice(i, 1); continue; }
      var hot = p.hot && p.life > .55;
      cx.globalAlpha = p.life * (hot ? .9 : .32);
      cx.fillStyle = hot ? "rgb(255," + Math.round(140 + 115 * p.life) + ",70)" : "rgb(205,200,235)";
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill();
    }
    cx.globalAlpha = 1;
    for(i = confetti.length - 1; i >= 0; i--){
      var c = confetti[i];
      c.vy += .2; c.vx *= .99; c.x += c.vx; c.y += c.vy; c.rot += c.vr;
      if(c.y > H + 30){ confetti.splice(i, 1); continue; }
      cx.save(); cx.translate(c.x, c.y); cx.rotate(c.rot);
      cx.fillStyle = c.c;
      cx.fillRect(-c.w/2, -c.h/2, c.w, Math.abs(Math.cos(c.rot * 2)) * c.h + 1);
      cx.restore();
    }
    raf = requestAnimationFrame(frame);
  }
  function setCount(el, t){
    el.textContent = t;
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  }
  function onKey(e){
    if(e.key === "Escape" || e.key === "Enter" || e.key === " "){ e.preventDefault(); skip(); }
  }
  function skip(){ Sound.hush(); close(); }

  function play(){
    close(true);
    root = document.createElement("div");
    root.className = "launch no-print";
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-label", "Анкета пройдена");
    root.innerHTML = '<canvas></canvas><div class="pad"></div>' +
      '<div class="ship"><div class="shaker">' + rocketSVG("off") + '</div></div>' +
      '<div class="count" aria-hidden="true"></div>' +
      '<div class="msg"><div class="msg-title">Анкета пройдена!</div><div class="msg-sub">Ваш ADKAR-радар готов</div></div>' +
      '<div class="skip">Нажмите, чтобы пропустить</div>';
    document.body.appendChild(root);
    cv = root.querySelector("canvas"); cx = cv.getContext("2d"); ship = root.querySelector(".ship");
    parts = []; confetti = []; lit = false; flying = false; speed = 0;
    resize(); makeStars();
    window.addEventListener("resize", resize);
    document.addEventListener("keydown", onKey);
    root.addEventListener("click", skip);
    document.documentElement.style.overflow = "hidden";
    raf = requestAnimationFrame(frame);
    requestAnimationFrame(function(){ if(root) root.classList.add("show"); });

    if(reduced()){
      root.classList.add("reduced");
      later(function(){ root.classList.add("done"); Sound.fanfare(); }, 200);
      later(close, 2400);
      return;
    }
    var cd = root.querySelector(".count");
    [["3", 450], ["2", 1050], ["1", 1650]].forEach(function(s){
      later(function(){ setCount(cd, s[0]); Sound.beep(false); }, s[1]);
    });
    later(function(){
      setCount(cd, "Пуск!"); Sound.beep(true); Sound.launch();
      lit = true;
      ship.querySelector(".rocket").classList.remove("off");
      ship.classList.add("shake");
    }, 2250);
    later(function(){ cd.classList.add("gone"); flying = true; ship.classList.add("fly"); }, 2950);
    later(function(){ burst(); root.classList.add("done"); Sound.fanfare(); }, 4500);
    later(function(){ lit = false; }, 5200);
    later(close, 7600);
  }

  function close(instant){
    if(!root) return;
    timers.forEach(clearTimeout); timers = [];
    window.removeEventListener("resize", resize);
    document.removeEventListener("keydown", onKey);
    document.documentElement.style.overflow = "";
    var r = root;
    root = null; ship = null; lit = false;
    function remove(){
      cancelAnimationFrame(raf);
      cx = null; cv = null;
      if(r.parentNode) r.parentNode.removeChild(r);
    }
    if(instant === true){ remove(); return; }
    r.classList.add("hide");
    setTimeout(function(){ if(!root) remove(); else if(r.parentNode) r.parentNode.removeChild(r); }, 700);
  }

  return {play:play};
})();

function radarSVG(c, p){
  var W = 520, H = 420, cx = 260, cy = 218, R = 140;
  function ang(i){ return (-90 + i*72) * Math.PI / 180; }
  function pt(i, r){ return [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))]; }
  function rad(v){ return (v + 0.5) / 4 * R; }
  function f(n){ return n.toFixed(1); }
  function ringPoly(r){
    return ELEMENTS.map(function(_, i){ var q = pt(i, r); return f(q[0]) + "," + f(q[1]); }).join(" ");
  }
  function scorePoly(comp){
    return ELEMENTS.map(function(e, i){ var q = pt(i, rad(comp.els[e.id].score)); return f(q[0]) + "," + f(q[1]); }).join(" ");
  }

  var s = '<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-labelledby="radar-title">';
  s += '<title id="radar-title">Лепестковая диаграмма: ' + ELEMENTS.map(function(e){ return e.ru + " — балл " + c.els[e.id].score + ", разброс " + c.els[e.id].spread; }).join("; ") + '</title>';

  for(var k = 4; k >= 1; k--){
    s += '<polygon class="ring z' + (k-1) + '" points="' + ringPoly(k*R/4) + '"/>';
  }
  ELEMENTS.forEach(function(_, i){
    var q = pt(i, R);
    s += '<line class="axis" x1="' + cx + '" y1="' + cy + '" x2="' + f(q[0]) + '" y2="' + f(q[1]) + '"/>';
  });
  for(var v = 0; v <= 3; v++){
    var rq = pt(0, rad(v));
    s += '<text class="ringnum" x="' + f(rq[0] + 8) + '" y="' + f(rq[1] + 4) + '">' + v + '</text>';
  }

  if(p){ s += '<polygon class="poly-prev" points="' + scorePoly(p) + '"/>'; }
  s += '<polygon class="poly-cur" points="' + scorePoly(c) + '"/>';

  ELEMENTS.forEach(function(e, i){
    var d = c.els[e.id];
    var a = ang(i);
    if(d.spread > 0){
      var p1 = pt(i, rad(d.score)), p2 = pt(i, rad(d.max));
      s += '<line class="spread" x1="' + f(p1[0]) + '" y1="' + f(p1[1]) + '" x2="' + f(p2[0]) + '" y2="' + f(p2[1]) + '"/>';
    }
    var nx = -Math.sin(a), ny = Math.cos(a);
    d.vals.forEach(function(val, li){
      var off = (li - 1) * 13;
      var base = pt(i, rad(val));
      var x = base[0] + nx*off, y = base[1] + ny*off;
      if(li === 0){
        s += '<circle class="mk" cx="' + f(x) + '" cy="' + f(y) + '" r="4.5"/>';
      }else if(li === 1){
        s += '<rect class="mk" x="' + f(x-4) + '" y="' + f(y-4) + '" width="8" height="8"/>';
      }else{
        s += '<polygon class="mk" points="' + f(x) + ',' + f(y-5.5) + ' ' + f(x-5) + ',' + f(y+4) + ' ' + f(x+5) + ',' + f(y+4) + '"/>';
      }
    });
  });

  ELEMENTS.forEach(function(e, i){
    var d = c.els[e.id];
    var q = pt(i, rad(d.score));
    if(c.bottleneck === e.id){
      s += '<circle class="bn-ring" cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="14"/>';
    }
    s += '<circle class="dot" cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="6.5"/>';
  });

  ELEMENTS.forEach(function(e, i){
    var d = c.els[e.id];
    var a = ang(i);
    var lp = pt(i, R + 22);
    var cosA = Math.cos(a), sinA = Math.sin(a);
    var anchor = cosA > 0.3 ? "start" : (cosA < -0.3 ? "end" : "middle");
    var lines = [
      {cls:"lab", t:e.ru},
      {cls:"lab-strong", t:e.id + ": " + d.score}
    ];
    if(c.bottleneck === e.id) lines.push({cls:"lab-bn", t:"узкое горлышко"});
    var lh = 18, y0;
    if(sinA < -0.9)      y0 = lp[1] - (lines.length - 1) * lh;
    else if(sinA > 0.5)  y0 = lp[1] + 12;
    else                 y0 = lp[1] - (lines.length - 1) * lh / 2 + 5;
    lines.forEach(function(ln, j){
      s += '<text class="' + ln.cls + '" x="' + f(lp[0]) + '" y="' + f(y0 + j*lh) + '" text-anchor="' + anchor + '">' + esc(ln.t) + '</text>';
    });
  });

  s += '</svg>';
  return s;
}

function legendHTML(hasPrev){
  var h = '<div class="legend">';
  h += '<span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" style="fill:var(--text2)"/></svg>слова</span>';
  h += '<span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" style="fill:var(--text2)"/></svg>дела</span>';
  h += '<span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,2 2.5,13 13.5,13" style="fill:var(--text2)"/></svg>среда</span>';
  h += '<span><svg width="26" height="16" viewBox="0 0 26 16" aria-hidden="true"><line x1="4" y1="8" x2="22" y2="8" style="stroke:var(--text);stroke-opacity:.16;stroke-width:10;stroke-linecap:round"/></svg>разброс</span>';
  h += '<span><svg width="26" height="16" viewBox="0 0 26 16" aria-hidden="true"><line x1="1" y1="8" x2="25" y2="8" style="stroke:var(--accent);stroke-width:2.5"/></svg>балл сейчас</span>';
  if(hasPrev){
    h += '<span><svg width="26" height="16" viewBox="0 0 26 16" aria-hidden="true"><line x1="1" y1="8" x2="25" y2="8" style="stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4"/></svg>для сравнения</span>';
  }
  h += '</div>';
  h += '<div class="legend">';
  for(var z = 0; z < 4; z++){
    h += '<span><i class="sw" style="background:var(--z' + z + ');border:1px solid var(--z' + z + 's)"></i>' + z + ' — ' + ZONES[z].name.replace(" зона","") + '</span>';
  }
  h += '</div>';
  return h;
}

function deltaHTML(now, before){
  var d = now - before;
  if(d > 0) return '<span class="delta-up">↑ +' + d + '</span>';
  if(d < 0) return '<span class="delta-down">↓ −' + Math.abs(d) + '</span>';
  return '<span class="delta-eq">без изменений</span>';
}

function renderResult(){
  var hist = loadHistory();
  if(!hist.length){ state.screen = "start"; render(); return; }

  var cur = null;
  for(var i = 0; i < hist.length; i++){ if(hist[i].id === state.viewId) cur = hist[i]; }
  if(!cur) cur = hist[hist.length - 1];
  var curIdx = hist.indexOf(cur);

  var prev = null;
  if(state.compareId !== null){
    for(var j = 0; j < hist.length; j++){ if(hist[j].id === state.compareId) prev = hist[j]; }
  }
  if(!prev && state.compareId === null && curIdx > 0) prev = hist[curIdx - 1];
  if(prev && prev.id === cur.id) prev = null;

  var c = compute(cur.answers);
  var p = prev ? compute(prev.answers) : null;
  var people = peopleList(cur.people);

  var html = '';

  /* шапка */
  html += '<p class="eyebrow">Результат</p>';
  html += '<h1>' + (cur.project ? esc(cur.project) : 'Ваш ADKAR-радар') + '</h1>';
  html += '<p class="lead">' + fmtDate(cur.date) + (people.length ? ' · про: ' + esc(people.join(", ")) : '') + '</p>';

  /* главный вывод */
  if(c.bottleneck){
    var bnEl = elById(c.bottleneck), bn = c.els[c.bottleneck];
    html += '<div class="card verdict alert">';
    html += '<h2>Узкое горлышко — ' + bnEl.ru + ' (' + bnEl.id + ')</h2>';
    html += '<p>' + zoneChip(bn.score) + '</p>';
    html += '<p>' + SCORE_TEXT[bnEl.id][bn.score] + '</p>';
    if(c.boomerang){
      html += '<p><b>Эффект бумеранга.</b> Осознание и желание на максимуме, а знание или способность провалены: идею продали, а людей не научили. Без поддержки энтузиазм сгорит об ошибки, и желание рухнет ниже стартового. Снимите давление результатом, пока «' + bnEl.ru.toLowerCase() + '» не выйдет хотя бы на 2.</p>';
      if(bn.score > c.minScore){
        html += '<p class="small">Балл ниже есть и у других элементов, но при таком профиле первым лечится именно этот.</p>';
      }
    }else if(c.tied.length){
      html += '<p class="small">Такой же балл у: ' + c.tied.map(function(id){ return elById(id).ru; }).join(", ") + '. Выбран «' + bnEl.ru + '», потому что он стоит раньше в последовательности A → D → K → Ab → R: ранний барьер обрушивает все следующие.</p>';
    }
    html += '<p>Рекомендации по этому элементу — первыми в разделе «Что делать» внизу страницы.</p>';
    html += '</div>';
  }else{
    html += '<div class="card verdict">';
    html += '<h2>Выраженного узкого горлышка нет</h2>';
    html += '<p>' + zoneChip(3) + '</p>';
    html += '<p>Все элементы в зелёной зоне. Главная задача сейчас — не потерять достигнутое: поддерживать ритуалы признания и регулярно повторять замер.</p>';
    html += '</div>';
  }

  if(prev){
    html += '<div class="note no-print" style="margin-bottom:16px">Для сравнения показан результат от <b>' + fmtDate(prev.date) + '</b> — пунктиром на диаграмме и в последней колонке таблицы.</div>';
  }

  /* диаграмма */
  html += '<div class="card radar-card">';
  html += radarSVG(c, p);
  html += legendHTML(!!p);
  html += '</div>';

  /* сводная таблица */
  html += '<h2 style="margin-top:28px">Сводная таблица</h2>';
  html += '<div class="tablewrap"><table>';
  html += '<thead><tr><th>Элемент</th><th>Слова</th><th>Дела</th><th>Среда</th><th>Балл</th><th>Разброс</th><th>Случаи</th>' + (p ? '<th>Было</th>' : '') + '</tr></thead><tbody>';
  ELEMENTS.forEach(function(e){
    var d = c.els[e.id];
    html += '<tr' + (c.bottleneck === e.id ? ' class="is-bn"' : '') + '>';
    html += '<td><b>' + e.id + '</b> ' + e.ru + '</td>';
    d.vals.forEach(function(v){
      html += '<td' + (d.spread >= 2 && v === d.score ? ' class="cell-low"' : '') + '>' + v + '</td>';
    });
    html += '<td><span class="zone-chip zc' + d.score + '">' + d.score + '</span></td>';
    html += '<td>' + d.spread + '</td>';
    html += '<td>' + d.ev + ' из 3</td>';
    if(p){
      var pd = p.els[e.id];
      html += '<td>' + pd.score + '<br>' + deltaHTML(d.score, pd.score) + '</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<p class="small" style="margin-top:8px">Балл — самый низкий из трёх каналов. Разброс — разница между самым высоким и самым низким. Красным выделены отстающие каналы, если разброс 2 и больше.</p>';

  /* индекс достоверности */
  var missing = [];
  ELEMENTS.forEach(function(e){ e.q.forEach(function(q){ if(!cur.answers[q.code].ev) missing.push(q); }); });
  html += '<div class="card" style="margin-top:20px">';
  html += '<h2>Индекс достоверности: ' + c.evTotal + ' из 15</h2>';
  html += '<p>' + evidenceLevel(c.evTotal);
  if(p) html += ' В прошлый раз: ' + p.evTotal + ' из 15.';
  html += '</p>';
  if(missing.length){
    html += '<p class="sub">Вопросы, где вы не смогли назвать конкретный случай, — это готовый список того, что стоит проверить в ближайшие две недели:</p>';
    html += '<ul>';
    missing.forEach(function(q){ html += '<li><b>' + q.code + '</b> — ' + q.text + '</li>'; });
    html += '</ul>';
  }else{
    html += '<p>За каждым ответом стоит реальный пример.</p>';
  }
  html += '</div>';

  /* карточки по элементам */
  html += '<h2 style="margin-top:28px">Вывод по каждому элементу</h2>';
  ELEMENTS.forEach(function(e){
    var d = c.els[e.id];
    var pt = patternText(d.pattern);
    var isBn = c.bottleneck === e.id;
    html += '<div class="card elcard' + (isBn ? ' is-bn' : '') + '">';
    html += '<h3><span>' + e.id + ' · ' + e.ru + '</span>' + (isBn ? ' <span class="bn-tag">узкое горлышко</span>' : '') + '</h3>';
    html += '<div class="meta">' + zoneChip(d.score) + '<span class="pill">Разброс ' + d.spread + '</span><span class="pill">Случаев ' + d.ev + ' из 3</span>';
    if(p) html += '<span class="pill">Было ' + p.els[e.id].score + ' · ' + deltaHTML(d.score, p.els[e.id].score) + '</span>';
    html += '</div>';
    html += '<div class="levels">';
    d.vals.forEach(function(v, li){
      html += '<div class="lvl' + (d.spread >= 2 && v === d.score ? ' low' : '') + '"><span class="ln">' + LEVELS[li].short + '</span><span class="lv">' + v + '</span></div>';
    });
    html += '</div>';
    html += '<p>' + SCORE_TEXT[e.id][d.score] + '</p>';
    html += '<p class="sub"><b>' + pt.title + '.</b> ' + pt.text + '</p>';
    if(d.ev < 2) html += '<p class="small">Мало конкретных случаев — вывод по этому элементу стоит проверить.</p>';
    html += '</div>';
  });

  /* кнопки */
  html += '<div class="stack no-print" style="margin-top:24px">';
  html += '<button class="btn primary block" data-action="restart">Пройти заново</button>';
  html += '<p class="small" style="text-align:center;margin:-4px 0 4px">Этот результат сохранится — в следующий раз вы увидите, что изменилось.</p>';
  html += '<button class="btn block" data-action="print">Распечатать или сохранить в PDF</button>';
  html += '</div>';

  /* история */
  if(hist.length > 1){
    html += '<div class="card no-print" style="margin-top:24px">';
    html += '<h2>История прохождений</h2>';
    html += '<p class="small">Выберите, с каким результатом сравнивать.</p>';
    html += '<ul class="hist">';
    hist.slice().reverse().forEach(function(h){
      var hc = compute(h.answers);
      var scores = ELEMENTS.map(function(e){ return e.id + " " + hc.els[e.id].score; }).join(" · ");
      html += '<li>';
      html += '<span class="hd">' + shortDate(h.date) + '</span>';
      html += '<span class="hs">' + (h.project ? esc(h.project) + '<br>' : '') + scores + '</span>';
      if(h.id === cur.id){
        html += '<span class="tag">показан сейчас</span>';
      }else if(prev && h.id === prev.id){
        html += '<span class="tag">идёт сравнение</span>';
      }else{
        html += '<button class="btn" data-action="compare" data-id="' + h.id + '">Сравнить</button>';
      }
      html += '</li>';
    });
    html += '</ul>';
    if(prev){
      html += '<button class="btn quiet" data-action="nocompare">Убрать сравнение</button>';
    }
    html += '</div>';
  }

  /* интерпретация */
  html += '<h2 style="margin-top:36px">Как читать результат</h2>';

  html += '<div class="card">';
  html += '<h3>Зоны по баллу</h3>';
  html += '<div class="zones">';
  for(var z = 0; z < 4; z++){
    html += '<div class="zc' + z + '"><b class="zn">' + z + '</b><span><b>' + ZONES[z].title + '.</b> ' + ZONES[z].text + '</span></div>';
  }
  html += '</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h3>Как читать разброс</h3>';
  html += '<p class="sub">Балл говорит, насколько плохо. Разброс говорит, чем именно «болеет» элемент, — и от этого зависит, что делать.</p>';
  ["even","deeds","env","words"].forEach(function(k){
    html += '<div class="pat"><h3>' + (k === "even" ? "Разброс 0–1: " : "Разброс 2–3, ") + PATTERNS[k].title.charAt(0).toLowerCase() + PATTERNS[k].title.slice(1) + '</h3><p>' + PATTERNS[k].text + '</p></div>';
  });
  html += '</div>';

  html += '<div class="card">';
  html += '<h3>Как выбирается узкое горлышко</h3>';
  html += '<p>Берётся элемент с самым низким баллом. Если таких несколько — тот, что раньше в последовательности A → D → K → Ab → R: пока не решён ранний барьер, чинить следующие бесполезно.</p>';
  html += '<p>Исключение — «эффект бумеранга»: если осознание и желание по 3, а знание или способность 0–1, узким горлышком автоматически становится провалившийся из них.</p>';
  html += '</div>';

  /* интервенции */
  html += '<h2 style="margin-top:36px">Что делать: интервенции по элементам</h2>';
  html += '<p class="sub">Выберите одно действие, которое займёт не больше двух часов, и проверьте его результат через две недели.</p>';
  var ids = ELEMENTS.map(function(e){ return e.id; });
  if(c.bottleneck){ ids = [c.bottleneck].concat(ids.filter(function(id){ return id !== c.bottleneck; })); }
  ids.forEach(function(id){
    var e = elById(id);
    var isBn = c.bottleneck === id;
    html += '<details class="int' + (isBn ? ' is-bn' : '') + '"' + (isBn ? ' open' : '') + '>';
    html += '<summary><span>' + e.id + ' · ' + e.ru + '</span>' + (isBn ? '<span class="bn-tag">ваше узкое горлышко</span>' : '') + '</summary>';
    html += '<div class="body"><ul>';
    INTERVENTIONS[id].forEach(function(it){ html += '<li><b>' + it[0] + '</b> — ' + it[1] + '</li>'; });
    html += '</ul></div></details>';
  });

  html += '<div class="stack no-print" style="margin-top:28px">';
  html += '<button class="btn quiet" data-action="wipe">Удалить все мои данные с этого устройства</button>';
  html += '</div>';

  app.innerHTML = html;
}

/* ===================== Переходы ===================== */

function render(){
  if(state.screen === "quiz") renderQuiz();
  else if(state.screen === "result") renderResult();
  else renderStart();
}

var enterTimer = 0;
function go(screen){
  state.screen = screen;
  render();
  scrollTop();
  app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
  clearTimeout(enterTimer);
  enterTimer = setTimeout(function(){ app.classList.remove("enter"); }, 900);
}

function blockMissing(){
  return ELEMENTS[state.block].q.filter(function(q){
    var a = state.answers[q.code];
    return !(a && typeof a.v === "number");
  });
}

function finish(){
  var hist = loadHistory();
  var result = {
    id: Date.now(),
    date: new Date().toISOString(),
    project: state.project.trim(),
    people: state.people.slice(),
    answers: JSON.parse(JSON.stringify(state.answers))
  };
  hist.push(result);
  writeJSON(KEY_HIST, hist);
  state.answers = {};
  state.block = 0;
  saveDraft();
  state.viewId = result.id;
  state.compareId = null;
  go("result");
  Launch.play();
}

app.addEventListener("input", function(e){
  var t = e.target;
  if(t.dataset.field === "project"){ state.project = t.value; saveDraft(); }
  if(t.dataset.field === "person"){ state.people[+t.dataset.idx] = t.value; saveDraft(); }
});

app.addEventListener("change", function(e){
  var t = e.target;
  if(t.type === "radio"){
    var code = t.name;
    var prevA = state.answers[code] || {ev:false};
    state.answers[code] = {v:+t.value, ev:!!prevA.ev};
    var box = document.getElementById("q-" + code);
    if(box){
      Array.prototype.forEach.call(box.querySelectorAll("label.opt"), function(l){
        l.classList.toggle("on", l.querySelector("input").checked);
      });
      box.classList.remove("missing");
      var err = box.querySelector(".q-err"); if(err) err.hidden = true;
    }
    saveDraft();
    updateProgress();
    Sound.select(+t.value);
    var nb = app.querySelector('[data-action="next"]');
    if(nb) nb.classList.toggle("ready", blockMissing().length === 0);
  }
  if(t.type === "checkbox" && t.dataset.ev){
    var c2 = t.dataset.ev;
    var a = state.answers[c2] || {v:null};
    state.answers[c2] = {v:a.v, ev:t.checked};
    t.closest("label").classList.toggle("on", t.checked);
    Sound.tick(t.checked);
    saveDraft();
  }
});

app.addEventListener("click", function(e){
  var b = e.target.closest("[data-action]");
  if(!b) return;
  var action = b.dataset.action;

  if(action === "begin" || action === "continue"){
    Sound.next();
    go("quiz");
  }
  else if(action === "fresh"){
    if(window.confirm("Начать анкету заново? Текущие ответы будут стёрты. Сохранённые результаты останутся.")){
      state.answers = {}; state.block = 0; saveDraft(); go("quiz");
    }
  }
  else if(action === "last"){
    state.viewId = null; state.compareId = null; go("result");
  }
  else if(action === "back"){
    Sound.tap();
    if(state.block === 0){ go("start"); }
    else{ state.block--; saveDraft(); go("quiz"); }
  }
  else if(action === "next"){
    var miss = blockMissing();
    if(miss.length){
      Sound.error();
      miss.forEach(function(q){
        var box = document.getElementById("q-" + q.code);
        if(box){ box.classList.add("missing"); var err = box.querySelector(".q-err"); if(err) err.hidden = false; }
      });
      var first = document.getElementById("q-" + miss[0].code);
      if(first){
        first.scrollIntoView({behavior:"smooth", block:"center"});
        var inp = first.querySelector("input"); if(inp) setTimeout(function(){ inp.focus({preventScroll:true}); }, 300);
      }
      return;
    }
    if(state.block < 4){ Sound.next(); state.block++; saveDraft(); go("quiz"); }
    else{ finish(); }
  }
  else if(action === "restart"){
    Sound.tap();
    state.answers = {}; state.block = 0; saveDraft(); go("start");
  }
  else if(action === "print"){
    window.print();
  }
  else if(action === "compare"){
    state.compareId = +b.dataset.id; render();
    var radar = document.querySelector(".radar-card");
    if(radar) radar.scrollIntoView({behavior:"smooth", block:"start"});
  }
  else if(action === "nocompare"){
    state.compareId = -1; render();
  }
  else if(action === "wipe"){
    if(window.confirm("Удалить все ответы и всю историю результатов с этого устройства? Восстановить их будет нельзя.")){
      removeKey(KEY_DRAFT); removeKey(KEY_HIST);
      state.answers = {}; state.block = 0; state.project = ""; state.people = ["","",""];
      state.viewId = null; state.compareId = null;
      go("start");
    }
  }
});

window.addEventListener("beforeprint", function(){
  Array.prototype.forEach.call(document.querySelectorAll("details.int"), function(d){ d.open = true; });
});

/* ===================== Запуск ===================== */

var soundBtn = document.getElementById("soundBtn");
var ICON_SPEAKER = '<path d="M11 5 6 9H3v6h3l5 4z"/>';
function paintSound(){
  var on = Sound.isOn();
  soundBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    ICON_SPEAKER + (on ? '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="m16 9 6 6M22 9l-6 6"/>') + '</svg>';
  soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
  soundBtn.setAttribute("aria-label", on ? "Выключить звук" : "Включить звук");
  soundBtn.title = on ? "Звук включён" : "Звук выключен";
}
soundBtn.addEventListener("click", function(){ Sound.toggle(); paintSound(); });
paintSound();

loadDraft();
render();

})();
</script>
</body>
</html>
